apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: redisclusters.cache.example.com
spec:
  group: cache.example.com
  names:
    kind: RedisCluster
    listKind: RedisClusterList
    plural: redisclusters
    singular: rediscluster
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - shards
                - nodesPerShard
              properties:
                shards:
                  description: "Number of shards (master nodes)."
                  type: integer
                  minimum: 1
                nodesPerShard:
                  description: "Number of nodes per shard (1 master + N-1 slaves)."
                  type: integer
                  minimum: 1
                redisPort:
                  description: "Redis container port (default 6379)."
                  type: integer
                  minimum: 1
                  maximum: 65535
                image:
                  description: "Redis container image name."
                  type: string
                passwordSecret:
                  description: "Name of a Secret containing the Redis password (key: password)."
                  type: string
            status:
              type: object
              properties:
                phase:
                  description: "Current lifecycle phase."
                  type: string
                  enum:
                    - Pending
                    - Creating
                    - Ready
                    - Degraded
                    - Deleting
                masterCount:
                  description: "Observed number of master nodes."
                  type: integer
                totalNodes:
                  description: "Observed total number of nodes."
                  type: integer
                slotBalance:
                  description: "Slot distribution state: balanced | migrating | unbalanced."
                  type: string
                  enum:
                    - balanced
                    - migrating
                    - unbalanced
                nodes:
                  description: "Per-node status."
                  type: array
                  items:
                    type: object
                    required:
                      - id
                      - ip
                      - port
                      - role
                      - healthy
                    properties:
                      id:
                        type: string
                      ip:
                        type: string
                      port:
                        type: integer
                      role:
                        type: string
                        enum:
                          - master
                          - slave
                      masterId:
                        type: string
                      slots:
                        type: array
                        items:
                          type: string
                      healthy:
                        type: boolean
                conditions:
                  description: "Conditions represent the latest available observations."
                  type: array
                  items:
                    type: object
                    required:
                      - type
                      - status
                      - lastTransitionTime
                      - reason
                      - message
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                        enum:
                          - "True"
                          - "False"
                          - "Unknown"
                      observedGeneration:
                        type: integer
                        format: int64
                      lastTransitionTime:
                        type: string
                        format: date-time
                      reason:
                        type: string
                      message:
                        type: string
      subresources:
        status: {}
