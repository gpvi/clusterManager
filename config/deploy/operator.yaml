apiVersion: apps/v1
kind: Deployment
metadata:
  name: cluster-operator
  namespace: default
  labels:
    app: cluster-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cluster-operator
  template:
    metadata:
      labels:
        app: cluster-operator
    spec:
      serviceAccountName: cluster-operator
      containers:
      - name: operator
        image: cluster-operator:latest
        imagePullPolicy: IfNotPresent
        command: ["/cluster-operator"]
        env:
        - name: KUBE_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
