apiVersion: apps/v1
kind: Deployment
metadata:
  name: cluster-toolserver
  namespace: default
  labels:
    app: cluster-toolserver
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cluster-toolserver
  template:
    metadata:
      labels:
        app: cluster-toolserver
    spec:
      containers:
      - name: toolserver
        image: cluster-toolserver:latest
        imagePullPolicy: IfNotPresent
        command: ["/cluster-agent"]
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: TOOL_SERVER_PORT
          value: "8080"
        - name: KUBE_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: cluster-toolserver
  namespace: default
spec:
  selector:
    app: cluster-toolserver
  ports:
  - port: 8080
    targetPort: 8080
    name: http
